<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>📸 照片墙 · 视界</title>
<style>
:root {
    --bg: #f0f0f4;
    --surface: #ffffff;
    --accent: #4f46e5;
    --text: #1a1a2e;
    --text-light: #6b7280;
    --text-muted: #9ca3af;
    --radius: 14px;
    --gap: 18px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
img { display: block; max-width: 100%; }

/* ===== 头部 ===== */
.header { position: relative; isolation: isolate; padding: 70px 20px 50px; text-align: center; overflow: hidden; }
.header-bg { position: absolute; inset: -40px; z-index: -2; background: radial-gradient(ellipse 70% 50% at 50% 20%, #2d2a5e 0%, transparent 70%), radial-gradient(ellipse 50% 40% at 80% 80%, #1e1b4b 0%, transparent 60%), linear-gradient(145deg, #0f0c29, #1a1a3e 45%, #242250); }
.header-icon { font-size: 2.6rem; display: block; margin-bottom: 8px; }
.site-title { font-size: 3rem; font-weight: 200; letter-spacing: 8px; color: rgba(255,255,255,0.92); }
.site-title strong { font-weight: 600; letter-spacing: 2px; }
.site-desc { font-size: 1rem; font-weight: 300; letter-spacing: 5px; color: rgba(255,255,255,0.4); margin-top: 6px; }

/* ===== 筛选栏 ===== */
.filters { padding: 16px 0 12px; text-align: center; background: rgba(255,255,255,0.7); backdrop-filter: blur(16px); position: sticky; top: 0; z-index: 50; border-bottom: 1px solid rgba(0,0,0,0.04); }
.filter-btn { display: inline-block; border: 1.5px solid #e5e7eb; background: transparent; color: var(--text-light); padding: 6px 20px; margin: 3px 4px; border-radius: 9999px; font-size: 0.85rem; font-weight: 500; font-family: var(--font); cursor: pointer; transition: background 0.25s, color 0.25s, border-color 0.25s, box-shadow 0.25s; user-select: none; }
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 16px rgba(79,70,229,0.35); }

/* ===== 3D 场景容器 ===== */
.scene { perspective: 1200px; perspective-origin: 50% 50%; padding: 0; overflow: visible; position: relative; }
.scene__stage { transform-style: preserve-3d; will-change: transform; transition: transform 0.08s cubic-bezier(0.22,1,0.36,1); max-width: 1340px; margin: 0 auto; padding: 0 16px; }

/* ===== 分页容器 ===== */
.paginator {
    position: relative;
    overflow: hidden;
    margin: 12px 0 0;
    border-radius: var(--radius);
}

/* 滑动轨道 — 横向放置所有页面 */
.paginator__track {
    display: flex;
    transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
}

/* 每一页 = 一个网格 */
.paginator__page {
    flex: 0 0 100%;
    min-width: 0;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--gap);
    padding: 6px 0 10px;
    transform-style: preserve-3d;
}

/* ===== 照片卡片 ===== */
.gallery-item { position: relative; border-radius: var(--radius); overflow: hidden; cursor: pointer; background: var(--surface); transform-style: preserve-3d; will-change: transform; transition: box-shadow 0.5s cubic-bezier(0.22,1,0.36,1), transform 0.5s cubic-bezier(0.22,1,0.36,1); animation: cardIn 0.5s ease both; }
.gallery-item .img-wrapper { position: relative; overflow: hidden; line-height: 0; border-radius: inherit; }
.gallery-item img { width: 100%; height: auto; display: block; transition: transform 0.7s cubic-bezier(0.22,1,0.36,1); backface-visibility: hidden; }
.gallery-item:hover img { transform: scale(1.12); }

/* 骨架屏 */
.skeleton { background: #e8e8ec; animation: shimmer 1.6s ease-in-out infinite; background-image: linear-gradient(90deg,#e8e8ec 0%,#f2f2f6 40%,#e8e8ec 80%); background-size: 200% 100%; }
.skel-h { aspect-ratio: 3/2; } .skel-v { aspect-ratio: 2/3; } .skel-sq { aspect-ratio: 1/1; } .skel-w { aspect-ratio: 16/9; }
.img-wrapper.loaded .skeleton { display: none; }

/* 悬浮覆盖层 */
.gallery-item .overlay { position: absolute; inset: 0; z-index: 2; background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.1) 40%, transparent 60%); display: flex; flex-direction: column; justify-content: flex-end; padding: 28px 16px 16px; opacity: 0; transition: opacity 0.4s cubic-bezier(0.22,1,0.36,1); }
.gallery-item:hover .overlay { opacity: 1; }
.overlay .photo-title { color: #fff; font-size: 0.9rem; font-weight: 500; letter-spacing: 0.3px; transform: translateY(12px); transition: transform 0.4s cubic-bezier(0.22,1,0.36,1); }
.gallery-item:hover .photo-title { transform: translateY(0); }
.overlay .photo-tag { display: inline-block; font-size: 0.65rem; color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.12); backdrop-filter: blur(4px); padding: 2px 10px; border-radius: 9999px; margin-top: 5px; width: fit-content; transform: translateY(12px); transition: transform 0.4s cubic-bezier(0.22,1,0.36,1) 0.03s; }
.gallery-item:hover .photo-tag { transform: translateY(0); }
.overlay .view-hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0.85); color: #fff; font-size: 0.8rem; letter-spacing: 1px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15); padding: 9px 20px; border-radius: 9999px; opacity: 0; transition: opacity 0.35s ease,transform 0.35s ease; pointer-events: none; }
.gallery-item:hover .view-hint { opacity: 1; transform: translate(-50%,-50%) scale(1); }

/* ===== 翻页控件 ===== */
.pagination-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 16px 0 30px;
}

/* 箭头按钮 */
.page-arrow {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1.5px solid #e0e0e4;
    background: var(--surface);
    color: var(--text-light);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.25s, border-color 0.25s, color 0.25s, box-shadow 0.25s, transform 0.25s;
    font-family: var(--font);
    user-select: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.page-arrow:hover {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 4px 16px rgba(79,70,229,0.15);
    transform: scale(1.05);
}
.page-arrow:active {
    transform: scale(0.95);
}
.page-arrow:disabled {
    opacity: 0.25;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
}

/* 页码指示 */
.page-indicator {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-light);
    letter-spacing: 0.5px;
    min-width: 70px;
    text-align: center;
    font-variant-numeric: tabular-nums;
}

/* 页数圆点 */
.page-dots {
    display: flex;
    gap: 6px;
    align-items: center;
}
.page-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #d4d4d8;
    transition: background 0.3s, transform 0.3s;
    cursor: pointer;
}
.page-dot.active {
    background: var(--accent);
    transform: scale(1.3);
}

/* ===== Lightbox ===== */
.lightbox { position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.78); backdrop-filter: blur(24px); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
.lightbox.open { opacity: 1; pointer-events: auto; }
.lightbox-inner { position: relative; max-width: 88vw; max-height: 88vh; display: flex; flex-direction: column; align-items: center; transform: scale(0.92); transition: transform 0.4s cubic-bezier(0.22,1,0.36,1); }
.lightbox.open .lightbox-inner { transform: scale(1); }
.lightbox-inner img { max-width: 100%; max-height: 78vh; border-radius: var(--radius); box-shadow: 0 25px 80px rgba(0,0,0,0.5); object-fit: contain; user-select: none; }
.lightbox-info { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 14px 4px 0; color: rgba(255,255,255,0.7); font-size: 0.85rem; }
.lb-counter { font-size: 0.8rem; color: rgba(255,255,255,0.4); }
.lb-close { position: absolute; top: -46px; right: -6px; color: rgba(255,255,255,0.5); font-size: 2.2rem; line-height: 1; cursor: pointer; background: none; border: none; font-family: var(--font); transition: color 0.25s, transform 0.25s; }
.lb-close:hover { color: #fff; transform: rotate(90deg) scale(1.1); }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); font-size: 1.3rem; padding: 14px 10px; cursor: pointer; border-radius: 8px; line-height: 1; transition: background 0.25s, color 0.25s; font-family: var(--font); }
.lb-nav:hover { background: rgba(255,255,255,0.12); color: #fff; }
.lb-prev { left: -56px; } .lb-next { right: -56px; }
.lb-hint { position: absolute; bottom: -34px; color: rgba(255,255,255,0.15); font-size: 0.65rem; letter-spacing: 1px; font-weight: 300; }

/* ===== 页脚 ===== */
.footer { text-align: center; padding: 20px 20px 28px; color: var(--text-muted); font-size: 0.75rem; letter-spacing: 1px; font-weight: 300; border-top: 1px solid rgba(0,0,0,0.05); }

/* ===== 动画 ===== */
@keyframes cardIn { from { opacity: 0; transform: translateY(20px) scale(0.95) translateZ(0); } to { opacity: 1; transform: translateY(0) scale(1) translateZ(0); } }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ===== 响应式 ===== */
@media (max-width: 1024px) { .gallery-grid { grid-template-columns: repeat(3, 1fr); } .site-title { font-size: 2.4rem; } }
@media (max-width: 720px) {
    .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .header { padding: 45px 16px 36px; }
    .site-title { font-size: 2rem; letter-spacing: 4px; }
    .site-desc { font-size: 0.85rem; letter-spacing: 3px; }
    .filter-btn { padding: 5px 14px; font-size: 0.78rem; margin: 3px 2px; }
    .scene { perspective: none; }
    .scene__stage { transform: none !important; }
    .gallery-item { transform: none !important; }
    .page-arrow { width: 38px; height: 38px; font-size: 1rem; }
    .page-dot { width: 6px; height: 6px; }
    .pagination-bar { gap: 12px; padding: 12px 0 22px; }
    .lb-prev { left: 6px; } .lb-next { right: 6px; }
    .lb-nav { font-size: 1rem; padding: 10px 7px; }
    .lb-close { top: -38px; right: 0; font-size: 1.6rem; }
}
@media (max-width: 440px) { .gallery-grid { grid-template-columns: 1fr; gap: 14px; } .site-title { font-size: 1.6rem; } }
</style>
</head>
<body>

<!-- ===== 头部 ===== -->
<header class="header">
    <div class="header-bg"></div>
    <span class="header-icon">📸</span>
    <h1 class="site-title"><strong>照片</strong>墙</h1>
    <p class="site-desc">用光影定格美好瞬间</p>
</header>

<!-- ===== 筛选栏 ===== -->
<nav class="filters">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="nature">🌿 自然</button>
    <button class="filter-btn" data-filter="city">🏙️ 城市</button>
    <button class="filter-btn" data-filter="people">👤 人物</button>
    <button class="filter-btn" data-filter="animal">🐾 动物</button>
</nav>

<!-- ===== 3D 视差场景 ===== -->
<div class="scene" id="scene">
    <div class="scene__stage" id="stage">

        <!-- ===== 分页容器 ===== -->
        <div class="paginator" id="paginator">
            <div class="paginator__track" id="track">
                <!-- 由 JS 动态生成各页 -->
            </div>
        </div>

        <!-- ===== 翻页控件 ===== -->
        <div class="pagination-bar">
            <button class="page-arrow" id="prevPage" aria-label="上一页">&#10094;</button>
            <div class="page-dots" id="pageDots"></div>
            <span class="page-indicator" id="pageIndicator">1 / 5</span>
            <button class="page-arrow" id="nextPage" aria-label="下一页">&#10095;</button>
        </div>

    </div>
</div>

<!-- ===== Lightbox ===== -->
<div class="lightbox" id="lightbox">
    <div class="lightbox-inner">
        <button class="lb-close" id="lbClose">&times;</button>
        <button class="lb-nav lb-prev" id="lbPrev">&#10094;</button>
        <button class="lb-nav lb-next" id="lbNext">&#10095;</button>
        <img src="" alt="" id="lbImage" />
        <div class="lightbox-info">
            <span id="lbTitle"></span>
            <span class="lb-counter" id="lbCounter"></span>
        </div>
        <span class="lb-hint">←  →  键盘切换 · Esc 关闭</span>
    </div>
</div>

<footer class="footer"><span>Made with ❤️ &middot; Powered by GitHub Pages</span></footer>

<script>
// =============================================
//  1. 照片数据
// =============================================
var PHOTOS = [];
for (var i = 1; i <= 33; i++) {
    PHOTOS.push({ id: i, src: 'images/' + i + '.jpg', title: '照片 ' + i, tag: 'nature' });
}
var TAG_LABEL = { nature: '🌿 自然', city: '🏙️ 城市', people: '👤 人物', animal: '🐾 动物' };
var SKELS = ['skel-h','skel-v','skel-sq','skel-w'];

// =============================================
//  2. 配置
// =============================================
var PER_PAGE = 8; // 每页显示 8 张

// =============================================
//  3. DOM
// =============================================
var track = document.getElementById('track');
var scene = document.getElementById('scene');
var stage = document.getElementById('stage');
var filterBtns = document.querySelectorAll('.filter-btn');
var prevBtn = document.getElementById('prevPage');
var nextBtn = document.getElementById('nextPage');
var pageDots = document.getElementById('pageDots');
var pageIndicator = document.getElementById('pageIndicator');

var lb = document.getElementById('lightbox');
var lbImg = document.getElementById('lbImage');
var lbTitle = document.getElementById('lbTitle');
var lbCounter = document.getElementById('lbCounter');
var lbClose = document.getElementById('lbClose');
var lbPrev = document.getElementById('lbPrev');
var lbNext = document.getElementById('lbNext');

var currentFilter = 'all';
var currentPage = 0;
var totalPages = 0;
var filtered = [];
var cardZ = [];

// =============================================
//  4. 渲染分页
// =============================================
function render(filter) {
    filter = filter || 'all';
    currentFilter = filter;
    currentPage = 0;

    filtered = filter === 'all' ? PHOTOS.slice() : PHOTOS.filter(function(p) { return p.tag === filter; });
    totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));

    track.innerHTML = '';
    cardZ = [];

    // 逐页生成
    for (var p = 0; p < totalPages; p++) {
        var pageDiv = document.createElement('div');
        pageDiv.className = 'paginator__page';

        var grid = document.createElement('div');
        grid.className = 'gallery-grid';

        var start = p * PER_PAGE;
        var end = Math.min(start + PER_PAGE, filtered.length);

        for (var idx = start; idx < end; idx++) {
            var photo = filtered[idx];
            var item = document.createElement('div');
            item.className = 'gallery-item';
            item.style.animationDelay = ((idx - start) * 0.04) + 's';

            var sk = SKELS[photo.id % SKELS.length];
            var wrap = document.createElement('div');
            wrap.className = 'img-wrapper';

            var skeleton = document.createElement('div');
            skeleton.className = 'skeleton ' + sk;

            var img = document.createElement('img');
            img.src = photo.src;
            img.alt = photo.title;
            img.loading = 'lazy';
            img.style.opacity = '0';

            img.addEventListener('load', function() {
                wrap.classList.add('loaded');
                img.style.opacity = '1';
                img.style.transition = 'opacity 0.5s ease';
            });
            img.addEventListener('error', function() {
                wrap.classList.add('loaded');
                img.style.opacity = '0.3';
            });

            wrap.appendChild(skeleton);
            wrap.appendChild(img);

            var overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML =
                '<span class="view-hint">👁 查看大图</span>' +
                '<div class="photo-title">' + esc(photo.title) + '</div>' +
                '<span class="photo-tag">' + (TAG_LABEL[photo.tag] || photo.tag) + '</span>';

            item.appendChild(wrap);
            item.appendChild(overlay);

            // 点击打开 lightbox（用全局索引）
            item.addEventListener(function(globalIdx) {
                return function() { openLB(globalIdx); };
            }(idx));

            grid.appendChild(item);

            // Z 深度
            var zBase = ((photo.id * 7 + 13) % 70) - 30;
            cardZ.push(zBase);
        }

        pageDiv.appendChild(grid);
        track.appendChild(pageDiv);
    }

    // 更新 Z 深度
    applyCardZ();

    // 切换到第一页
    goToPage(0);
    updatePaginationUI();

    // 绑定卡片 hover
    bindCardHover();
}

function esc(s) { var d = document.createElement('div'); d.appendChild(document.createTextNode(s)); return d.innerHTML; }

function applyCardZ() {
    var all = document.querySelectorAll('.gallery-item');
    all.forEach(function(el, i) {
        if (!el.classList.contains('lifted')) {
            el.style.transform = 'translateZ(' + (cardZ[i] || 0) + 'px)';
        }
    });
}

// =============================================
//  5. 翻页
// =============================================
function goToPage(n) {
    currentPage = Math.max(0, Math.min(n, totalPages - 1));
    var offset = -currentPage * 100;
    track.style.transform = 'translateX(' + offset + '%)';
    updatePaginationUI();
}

function updatePaginationUI() {
    // 箭头状态
    prevBtn.disabled = currentPage <= 0;
    nextBtn.disabled = currentPage >= totalPages - 1;

    // 圆点
    pageDots.innerHTML = '';
    for (var i = 0; i < totalPages; i++) {
        var dot = document.createElement('span');
        dot.className = 'page-dot' + (i === currentPage ? ' active' : '');
        dot.addEventListener('click', function(p) { return function() { goToPage(p); }; }(i));
        pageDots.appendChild(dot);
    }

    // 文字指示
    pageIndicator.textContent = (currentPage + 1) + ' / ' + totalPages;
}

// 翻页事件
prevBtn.addEventListener('click', function() { if (currentPage > 0) goToPage(currentPage - 1); });
nextBtn.addEventListener('click', function() { if (currentPage < totalPages - 1) goToPage(currentPage + 1); });

// 键盘翻页
document.addEventListener('keydown', function(e) {
    // 如果 lightbox 开着，由 lightbox 处理
    if (lb.classList.contains('open')) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); if (currentPage > 0) goToPage(currentPage - 1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); if (currentPage < totalPages - 1) goToPage(currentPage + 1); }
});

// =============================================
//  6. 全局 3D 滑移视差
// =============================================
(function() {
    var tRX = 0, tRY = 0, tTX = 0, tTY = 0;
    var cRX = 0, cRY = 0, cTX = 0, cTY = 0;
    var aid = null;
    var enabled = window.innerWidth > 720;
    var MAX_R = 5, MAX_T = 10;

    function onMove(e) {
        if (!enabled) return;
        var rect = scene.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        var nx = Math.max(-1, Math.min(1, (e.clientX - cx) / (rect.width / 2)));
        var ny = Math.max(-1, Math.min(1, (e.clientY - cy) / (rect.height / 2)));
        var sx = nx * Math.abs(nx), sy = ny * Math.abs(ny);
        tRY = sx * MAX_R; tRX = sy * -MAX_R;
        tTX = sx * MAX_T; tTY = sy * MAX_T;
        if (!aid) aid = requestAnimationFrame(tick);
    }

    function tick() {
        var e = 0.12;
        cRX += (tRX - cRX) * e; cRY += (tRY - cRY) * e;
        cTX += (tTX - cTX) * e; cTY += (tTY - cTY) * e;
        stage.style.transform = 'rotateX(' + cRX + 'deg) rotateY(' + cRY + 'deg) translateX(' + cTX + 'px) translateY(' + cTY + 'px)';
        if (Math.abs(tRX-cRX) > 0.01 || Math.abs(tRY-cRY) > 0.01) { aid = requestAnimationFrame(tick); }
        else { cRX = tRX; cRY = tRY; cTX = tTX; cTY = tTY; stage.style.transform = 'rotateX(' + cRX + 'deg) rotateY(' + cRY + 'deg) translateX(' + cTX + 'px) translateY(' + cTY + 'px)'; aid = null; }
    }

    function onLeave() { tRX = 0; tRY = 0; tTX = 0; tTY = 0; if (!aid) aid = requestAnimationFrame(tick); }
    function onResize() { enabled = window.innerWidth > 720; if (!enabled) { stage.style.transform = ''; cRX = cRY = cTX = cTY = 0; tRX = tRY = tTX = tTY = 0; } }

    scene.addEventListener('mousemove', onMove);
    scene.addEventListener('mouseleave', onLeave);
    window.addEventListener('resize', onResize);
})();

// =============================================
//  7. 卡片悬浮提升
// =============================================
function bindCardHover() {
    document.querySelectorAll('.gallery-item').forEach(function(el, idx) {
        el.addEventListener('mouseenter', function() {
            var z = cardZ[idx] || 0;
            el.style.transition = 'transform 0.4s cubic-bezier(0.22,1,0.36,1), box-shadow 0.4s ease';
            el.style.transform = 'translateZ(' + (z + 45) + 'px)';
            el.style.boxShadow = '0 30px 60px rgba(0,0,0,0.25)';
            el.classList.add('lifted');
        });
        el.addEventListener('mouseleave', function() {
            var z = cardZ[idx] || 0;
            el.style.transition = 'transform 0.4s cubic-bezier(0.22,1,0.36,1), box-shadow 0.4s ease';
            el.style.transform = 'translateZ(' + z + 'px)';
            el.style.boxShadow = '';
            el.classList.remove('lifted');
        });
    });
}

// =============================================
//  8. Lightbox
// =============================================
function openLB(idx) {
    currentIndex = idx;
    var p = filtered[idx]; if (!p) return;
    lbImg.src = p.src; lbImg.alt = p.title;
    lbTitle.textContent = p.title + ' · ' + (TAG_LABEL[p.tag] || p.tag);
    lbCounter.textContent = (idx + 1) + ' / ' + filtered.length;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
}
function closeLB() { lb.classList.remove('open'); document.body.style.overflow = ''; }
function prevP() { if (!filtered.length) return; currentIndex = (currentIndex - 1 + filtered.length) % filtered.length; syncLB(); }
function nextP() { if (!filtered.length) return; currentIndex = (currentIndex + 1) % filtered.length; syncLB(); }
function syncLB() { var p = filtered[currentIndex]; if (p) { lbImg.src=p.src; lbImg.alt=p.title; lbTitle.textContent=p.title+' · '+(TAG_LABEL[p.tag]||p.tag); lbCounter.textContent=(currentIndex+1)+' / '+filtered.length; } }

// =============================================
//  9. 事件绑定
// =============================================
filterBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
        filterBtns.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        render(btn.getAttribute('data-filter'));
    });
});

lbClose.addEventListener('click', closeLB);
lb.addEventListener('click', function(e) { if (e.target === lb) closeLB(); });
lbPrev.addEventListener('click', function(e) { e.stopPropagation(); prevP(); });
lbNext.addEventListener('click', function(e) { e.stopPropagation(); nextP(); });

document.addEventListener('keydown', function(e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') { closeLB(); return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); prevP(); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); nextP(); return; }
});

// =============================================
//  10. 启动
// =============================================
render('all');
</script>

</body>
</html>
