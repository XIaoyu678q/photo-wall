<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>📸 照片墙</title>
<style>
/* =============================================
   照片墙 — 互动版（3D倾角 · 鼠标追踪 · 动感网格）
   ============================================= */

/* ---------- CSS 变量 ---------- */
:root {
    --color-bg: #f4f4f6;
    --color-surface: #ffffff;
    --color-text: #1a1a2e;
    --color-text-light: #6b7280;
    --color-text-muted: #9ca3af;
    --color-accent: #4f46e5;
    --color-accent-glow: rgba(79,70,229,0.3);
    --color-border: rgba(0,0,0,0.06);
    --color-overlay: rgba(0,0,0,0.78);

    --gap: 18px;
    --radius-card: 14px;
    --radius-pill: 9999px;

    --shadow-card: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-hover: 0 20px 50px rgba(0,0,0,0.18);

    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;

    --transition: 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    --transition-fast: 0.18s cubic-bezier(0.22, 1, 0.36, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

body {
    font-family: var(--font);
    background: var(--color-bg);
    color: var(--color-text);
    line-height: 1.7;
    overflow-x: hidden;
}

img { display: block; max-width: 100%; }

/* ================================
   鼠标跟随光晕
   ================================ */
#cursorGlow {
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(79,70,229,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 1;
    transform: translate(-50%, -50%);
    transition: opacity 0.4s ease;
    will-change: transform;
}

/* ================================
   头部 — 暗色质感 + 视差
   ================================ */
.header {
    position: relative;
    isolation: isolate;
    padding: 90px 20px 75px;
    text-align: center;
    overflow: hidden;
}

.header-bg {
    position: absolute;
    inset: -40px;
    z-index: -2;
    background:
        radial-gradient(ellipse 70% 50% at 50% 20%, #2d2a5e 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 80%, #1e1b4b 0%, transparent 60%),
        linear-gradient(145deg, #0f0c29, #1a1a3e 45%, #242250);
}

.header-noise {
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
}

.header-icon {
    font-size: 3rem;
    display: block;
    margin-bottom: 10px;
    animation: floatY 3s ease-in-out infinite;
}

.site-title {
    font-size: 3.4rem;
    font-weight: 200;
    letter-spacing: 8px;
    color: rgba(255,255,255,0.92);
}

.site-title strong { font-weight: 600; letter-spacing: 2px; }

.site-desc {
    font-size: 1rem;
    font-weight: 300;
    letter-spacing: 5px;
    color: rgba(255,255,255,0.4);
    margin-top: 8px;
}

/* ================================
   筛选栏
   ================================ */
.filters {
    padding: 20px 0 16px;
    text-align: center;
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    position: sticky;
    top: 0;
    z-index: 50;
    border-bottom: 1px solid var(--color-border);
}

/* 磁性按钮 — 鼠标靠近时略微移动 */
.filter-btn {
    position: relative;
    display: inline-block;
    border: 1.5px solid #e5e7eb;
    background: transparent;
    color: var(--color-text-light);
    padding: 7px 22px;
    margin: 4px 5px;
    border-radius: var(--radius-pill);
    font-size: 0.875rem;
    font-weight: 500;
    font-family: var(--font);
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background var(--transition-fast), color var(--transition-fast),
                border-color var(--transition-fast), box-shadow var(--transition-fast);
    user-select: none;
}

.filter-btn:hover {
    border-color: var(--color-accent);
    color: var(--color-accent);
}

.filter-btn.active {
    background: var(--color-accent);
    color: #fff;
    border-color: var(--color-accent);
    box-shadow: 0 4px 16px rgba(79,70,229,0.35);
}

/* ================================
   照片网格 — Grid + 动态交错
   ================================ */
.gallery {
    padding: var(--gap) 0 50px;
    position: relative;
    z-index: 2;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--gap);
    padding: var(--gap) 0;
}

/* 照片卡片 */
.gallery-item {
    position: relative;
    border-radius: var(--radius-card);
    overflow: hidden;
    cursor: pointer;
    background: var(--color-surface);
    box-shadow: var(--shadow-card);
    /* 3D 透视由 JS 动态控制 */
    transform-style: preserve-3d;
    will-change: transform;
    transition: box-shadow var(--transition);
    animation: cardIn 0.5s ease both;
}

/* 内部反射光泽层（跟随鼠标） */
.gallery-item .gloss {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    border-radius: inherit;
    opacity: 0;
    transition: opacity 0.3s ease;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.25) 0%, transparent 60%);
}

.gallery-item:hover .gloss {
    opacity: 1;
}

/* 图片容器 */
.gallery-item .img-wrapper {
    position: relative;
    overflow: hidden;
    line-height: 0;
    border-radius: inherit;
}

.gallery-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}

.gallery-item:hover img {
    transform: scale(1.1);
}

/* ---------- 骨架屏 ---------- */
.skeleton {
    background: #e8e8ec;
    animation: shimmer 1.6s ease-in-out infinite;
    background-image: linear-gradient(90deg, #e8e8ec 0%, #f2f2f6 40%, #e8e8ec 80%);
    background-size: 200% 100%;
}
.skeleton-h { aspect-ratio: 3/2; }
.skeleton-v { aspect-ratio: 2/3; }
.skeleton-sq { aspect-ratio: 1/1; }
.skeleton-w { aspect-ratio: 16/9; }

.img-wrapper.loaded .skeleton { display: none; }

/* ---------- 悬浮覆盖层 ---------- */
.gallery-item .overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.15) 40%, transparent 60%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 28px 16px 16px;
    opacity: 0;
    transition: opacity var(--transition);
}

.gallery-item:hover .overlay { opacity: 1; }

.overlay .photo-title {
    color: #fff;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.3px;
    transform: translateY(10px);
    transition: transform var(--transition);
}

.gallery-item:hover .photo-title { transform: translateY(0); }

.overlay .photo-tag {
    display: inline-block;
    font-size: 0.65rem;
    color: rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(4px);
    padding: 2px 10px;
    border-radius: var(--radius-pill);
    margin-top: 5px;
    width: fit-content;
    transform: translateY(10px);
    transition: transform var(--transition);
}

.gallery-item:hover .photo-tag { transform: translateY(0); }

.overlay .view-hint {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    color: #fff;
    font-size: 0.8rem;
    letter-spacing: 1px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 9px 20px;
    border-radius: var(--radius-pill);
    opacity: 0;
    transition: opacity var(--transition), transform var(--transition);
    pointer-events: none;
}

.gallery-item:hover .view-hint { opacity: 1; transform: translate(-50%, -50%) scale(1); }

/* ================================
   Lightbox
   ================================ */
.lightbox {
    position: fixed;
    inset: 0;
    z-index: 999;
    background: var(--color-overlay);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
}

.lightbox.open { opacity: 1; pointer-events: auto; }

.lightbox-inner {
    position: relative;
    max-width: 88vw;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: scale(0.9);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}

.lightbox.open .lightbox-inner { transform: scale(1); }

.lightbox-inner img {
    max-width: 100%;
    max-height: 78vh;
    border-radius: var(--radius-card);
    box-shadow: 0 25px 80px rgba(0,0,0,0.5);
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
}

.lightbox-info {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; padding: 14px 4px 0;
    color: rgba(255,255,255,0.7); font-size: 0.85rem;
}

.lb-counter { font-size: 0.8rem; color: rgba(255,255,255,0.4); }

.lb-close {
    position: absolute; top: -48px; right: -6px;
    color: rgba(255,255,255,0.5); font-size: 2.2rem; line-height: 1;
    cursor: pointer; background: none; border: none; font-family: var(--font);
    transition: color var(--transition-fast), transform var(--transition-fast);
}
.lb-close:hover { color: #fff; transform: rotate(90deg) scale(1.1); }

.lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.5); font-size: 1.3rem;
    padding: 14px 10px; cursor: pointer; border-radius: 8px; line-height: 1;
    transition: background var(--transition-fast), color var(--transition-fast);
    font-family: var(--font);
}
.lb-nav:hover { background: rgba(255,255,255,0.12); color: #fff; }
.lb-prev { left: -56px; }
.lb-next { right: -56px; }

.lb-hint {
    position: absolute; bottom: -34px;
    color: rgba(255,255,255,0.15); font-size: 0.65rem; letter-spacing: 1px;
    font-weight: 300;
}

/* ================================
   页脚
   ================================ */
.footer {
    text-align: center; padding: 28px 20px 36px;
    color: var(--color-text-muted); font-size: 0.75rem; letter-spacing: 1px;
    font-weight: 300; border-top: 1px solid var(--color-border);
}

/* ================================
   动画
   ================================ */
@keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

@keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
}

/* ================================
   响应式
   ================================ */
@media (max-width: 1024px) {
    .gallery-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 720px) {
    .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .header { padding: 55px 16px 50px; }
    .site-title { font-size: 2.2rem; letter-spacing: 5px; }
    .site-desc { font-size: 0.85rem; letter-spacing: 3px; }
    .filter-btn { padding: 5px 14px; font-size: 0.78rem; margin: 3px 2px; }
    .lb-prev { left: 6px; }
    .lb-next { right: 6px; }
    .lb-nav { font-size: 1rem; padding: 10px 7px; }
    .lb-close { top: -38px; right: 0; font-size: 1.6rem; }
}

@media (max-width: 440px) {
    .gallery-grid { grid-template-columns: 1fr; gap: 14px; }
    .site-title { font-size: 1.8rem; }
}
</style>
</head>
<body>

<!-- ===== 鼠标跟随光晕 ===== -->
<div id="cursorGlow"></div>

<!-- ===== 头部 ===== -->
<header class="header" id="header">
    <div class="header-bg"></div>
    <div class="header-noise"></div>
    <span class="header-icon">📸</span>
    <h1 class="site-title"><strong>照片</strong>墙</h1>
    <p class="site-desc">用光影定格美好瞬间</p>
</header>

<!-- ===== 筛选栏 ===== -->
<nav class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="nature">🌿 自然</button>
    <button class="filter-btn" data-filter="city">🏙️ 城市</button>
    <button class="filter-btn" data-filter="people">👤 人物</button>
    <button class="filter-btn" data-filter="animal">🐾 动物</button>
</nav>

<!-- ===== 照片网格 ===== -->
<main class="gallery">
    <div class="container" style="max-width:1320px;margin:0 auto;padding:0 18px;">
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>
</main>

<!-- ===== Lightbox ===== -->
<div class="lightbox" id="lightbox">
    <div class="lightbox-inner">
        <button class="lb-close" id="lbClose">&times;</button>
        <button class="lb-nav lb-prev" id="lbPrev">&#10094;</button>
        <button class="lb-nav lb-next" id="lbNext">&#10095;</button>
        <img src="" alt="" id="lbImage" />
        <div class="lightbox-info">
            <span id="lbTitle"></span>
            <span class="lb-counter" id="lbCounter"></span>
        </div>
        <span class="lb-hint">←  →  键盘切换</span>
    </div>
</div>

<!-- ===== 页脚 ===== -->
<footer class="footer"><span>Made with ❤️ &middot; Powered by GitHub Pages</span></footer>

<script>
// =============================================
//  1. 照片数据
// =============================================
var PHOTOS = [];
for (var i = 1; i <= 33; i++) {
    PHOTOS.push({ id: i, src: 'images/' + i + '.jpg', title: '照片 ' + i, tag: 'nature' });
}

var TAG_LABEL = {
    nature: '🌿 自然', city: '🏙️ 城市',
    people: '👤 人物', animal: '🐾 动物'
};

var SKELETONS = ['skeleton-h', 'skeleton-v', 'skeleton-sq', 'skeleton-w'];

// =============================================
//  2. DOM
// =============================================
var gridEl = document.getElementById('galleryGrid');
var filterBtns = document.querySelectorAll('.filter-btn');
var lb = document.getElementById('lightbox');
var lbImg = document.getElementById('lbImage');
var lbTitle = document.getElementById('lbTitle');
var lbCounter = document.getElementById('lbCounter');
var lbClose = document.getElementById('lbClose');
var lbPrev = document.getElementById('lbPrev');
var lbNext = document.getElementById('lbNext');
var glow = document.getElementById('cursorGlow');

var currentFilter = 'all';
var currentIndex = 0;
var filtered = [];

// =============================================
//  3. 渲染
// =============================================
function render(filter) {
    filter = filter || 'all';
    currentFilter = filter;
    filtered = filter === 'all' ? PHOTOS.slice() : PHOTOS.filter(function(p) { return p.tag === filter; });
    gridEl.innerHTML = '';

    filtered.forEach(function(photo, idx) {
        var item = document.createElement('div');
        item.className = 'gallery-item';
        item.style.animationDelay = (idx * 0.04) + 's';

        var sk = SKELETONS[photo.id % SKELETONS.length];
        var wrap = document.createElement('div');
        wrap.className = 'img-wrapper';

        var skeleton = document.createElement('div');
        skeleton.className = 'skeleton ' + sk;

        var img = document.createElement('img');
        img.src = photo.src;
        img.alt = photo.title;
        img.loading = 'lazy';
        img.style.opacity = '0';

        img.addEventListener('load', function() {
            wrap.classList.add('loaded');
            img.style.opacity = '1';
            img.style.transition = 'opacity 0.5s ease';
        });
        img.addEventListener('error', function() {
            wrap.classList.add('loaded');
            img.style.opacity = '0.3';
        });

        wrap.appendChild(skeleton);
        wrap.appendChild(img);

        // 光泽层（鼠标追踪用）
        var gloss = document.createElement('div');
        gloss.className = 'gloss';

        var overlay = document.createElement('div');
        overlay.className = 'overlay';
        overlay.innerHTML =
            '<span class="view-hint">👁 查看大图</span>' +
            '<div class="photo-title">' + esc(photo.title) + '</div>' +
            '<span class="photo-tag">' + (TAG_LABEL[photo.tag] || photo.tag) + '</span>';

        item.appendChild(wrap);
        item.appendChild(gloss);
        item.appendChild(overlay);

        item.addEventListener('click', function() { openLB(idx); });

        gridEl.appendChild(item);
    });
}

function esc(s) { var d = document.createElement('div'); d.appendChild(document.createTextNode(s)); return d.innerHTML; }

// =============================================
//  4. Lightbox
// =============================================
function openLB(idx) {
    currentIndex = idx;
    var p = filtered[idx]; if (!p) return;
    lbImg.src = p.src; lbImg.alt = p.title;
    lbTitle.textContent = p.title + ' · ' + (TAG_LABEL[p.tag] || p.tag);
    lbCounter.textContent = (idx + 1) + ' / ' + filtered.length;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeLB() { lb.classList.remove('open'); document.body.style.overflow = ''; }
function prevP() { if (!filtered.length) return; currentIndex = (currentIndex - 1 + filtered.length) % filtered.length; syncLB(); }
function nextP() { if (!filtered.length) return; currentIndex = (currentIndex + 1) % filtered.length; syncLB(); }
function syncLB() { var p = filtered[currentIndex]; if (p) { lbImg.src = p.src; lbImg.alt = p.title; lbTitle.textContent = p.title + ' · ' + (TAG_LABEL[p.tag] || p.tag); lbCounter.textContent = (currentIndex + 1) + ' / ' + filtered.length; } }

// =============================================
//  5. 鼠标交互 — 3D 倾角 + 光泽跟随
// =============================================
// —— 全局光晕跟随鼠标 ——
document.addEventListener('mousemove', function(e) {
    var x = e.clientX, y = e.clientY;
    glow.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
    // 光晕随鼠标缓动（因为是 fixed 定位，直接 translate 即可）
});

// —— 卡片 3D 倾角 + 光泽 ——
function initTilt() {
    var cards = document.querySelectorAll('.gallery-item');
    cards.forEach(function(card) {
        // 获取光泽层
        var gloss = card.querySelector('.gloss');
        if (!gloss) return;

        card.addEventListener('mousemove', function(e) {
            var rect = card.getBoundingClientRect();
            // 鼠标相对于卡片的位置（0~1）
            var x = (e.clientX - rect.left) / rect.width;
            var y = (e.clientY - rect.top) / rect.height;
            // 倾角范围 ±8°
            var tiltX = (y - 0.5) * -16;
            var tiltY = (x - 0.5) * 16;
            // 应用 3D 变换
            card.style.transform =
                'perspective(800px) rotateX(' + tiltX + 'deg) rotateY(' + tiltY + 'deg) scale3d(1.02,1.02,1.02)';
            // 光泽层: 径向渐变跟随鼠标
            gloss.style.background =
                'radial-gradient(circle at ' + (x * 100) + '% ' + (y * 100) + '%, rgba(255,255,255,0.2) 0%, transparent 60%)';
        });

        card.addEventListener('mouseleave', function() {
            card.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
            // 用 transition 让卡片平滑复位
            card.style.transition = 'transform 0.5s cubic-bezier(0.22,1,0.36,1)';
            setTimeout(function() { card.style.transition = ''; }, 500);
            if (gloss) gloss.style.background = '';
        });
    });
}

// —— 头部视差 ——
var header = document.getElementById('header');
var headerBg = header.querySelector('.header-bg');
document.addEventListener('mousemove', function(e) {
    var x = (e.clientX / window.innerWidth - 0.5) * 2;
    var y = (e.clientY / window.innerHeight - 0.5) * 2;
    headerBg.style.transform = 'translate(' + (x * -10) + 'px, ' + (y * -10) + 'px)';
});

// —— 筛选按钮磁性效果 ——
filterBtns.forEach(function(btn) {
    btn.addEventListener('mousemove', function(e) {
        var rect = btn.getBoundingClientRect();
        var x = e.clientX - rect.left - rect.width / 2;
        var y = e.clientY - rect.top - rect.height / 2;
        var dist = Math.sqrt(x * x + y * y);
        var maxDist = Math.max(rect.width, rect.height);
        var pull = Math.min(1, dist / maxDist);
        var dx = x * 0.15 * (1 - pull);
        var dy = y * 0.15 * (1 - pull);
        btn.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
    });
    btn.addEventListener('mouseleave', function() {
        btn.style.transform = '';
    });
});

// =============================================
//  6. 事件绑定
// =============================================
filterBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
        filterBtns.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        render(btn.getAttribute('data-filter'));
        // 重新绑定 3D 倾角（因为 DOM 重建了）
        initTilt();
    });
});

lbClose.addEventListener('click', closeLB);
lb.addEventListener('click', function(e) { if (e.target === lb) closeLB(); });
lbPrev.addEventListener('click', function(e) { e.stopPropagation(); prevP(); });
lbNext.addEventListener('click', function(e) { e.stopPropagation(); nextP(); });

document.addEventListener('keydown', function(e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') { closeLB(); return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); prevP(); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); nextP(); return; }
});

// =============================================
//  7. 启动
// =============================================
render('all');
// 等 DOM 渲染完成后再绑定倾角
requestAnimationFrame(function() { initTilt(); });
</script>

</body>
