<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>📸 照片墙 · 流</title>
<style>
/* =============================================
   照片墙 — 惯性拖拽 · 3D视差 · 高级动效
   ============================================= */
:root {
    --bg: #12121a;
    --surface: #1c1c26;
    --accent: #6d6dff;
    --text: rgba(255,255,255,0.85);
    --text-light: rgba(255,255,255,0.5);
    --radius: 10px;
    --gap: 14px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}
img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

/* ===== 头部 ===== */
.header {
    position: relative; z-index: 10;
    padding: 28px 32px 16px;
    display: flex; align-items: center; justify-content: space-between;
}
.header-left { display: flex; align-items: center; gap: 14px; }
.header-icon { font-size: 1.6rem; }
.site-title { font-size: 1.3rem; font-weight: 300; letter-spacing: 3px; color: var(--text); }
.site-title strong { font-weight: 600; letter-spacing: 1px; }

/* ===== 筛选栏 ===== */
.filters {
    padding: 0 32px 16px;
    display: flex; gap: 8px;
    position: relative; z-index: 10;
}
.filter-btn {
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: var(--text-light);
    padding: 5px 18px;
    border-radius: 9999px;
    font-size: 0.78rem;
    font-weight: 400;
    font-family: var(--font);
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: background 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
    backdrop-filter: blur(8px);
}
.filter-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 20px rgba(109,109,255,0.3); }

/* ===== 照片墙主容器 ===== */
/* 遮罩层：让鼠标移出舞台区时平滑复位 3D */
.viewport-mask {
    position: relative;
    z-index: 5;
    height: calc(100vh - 120px);
    overflow: hidden;
    perspective: 1000px;
    perspective-origin: 50% 40%;
}

/* 舞台：整体 3D 容器，由 JS 控制 rotateX/Y */
.stage {
    transform-style: preserve-3d;
    will-change: transform;
    height: 100%;
    width: 100%;
}

/* 视口裁剪（隐藏滚动条） */
.scroll-viewport {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: relative;
    cursor: grab;
    -webkit-overflow-scrolling: touch;
}
.scroll-viewport:active { cursor: grabbing; }

/* 内部宽内容 — 横向 flex */
.scroll-content {
    display: flex;
    gap: var(--gap);
    padding: 8px 32px 8px 32px;
    height: 100%;
    will-change: transform;
    transform-style: preserve-3d;
    /* 拖拽时禁止换行 */
    flex-wrap: nowrap;
}

/* ===== 每列 ===== */
.photo-column {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    flex-shrink: 0;
    transform-style: preserve-3d;
    will-change: transform;
}

/* ===== 照片卡片 ===== */
.photo-card {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    background: var(--surface);
    flex-shrink: 0;
    transform-style: preserve-3d;
    will-change: transform;
    transition: box-shadow 0.4s cubic-bezier(0.22,1,0.36,1);
    backface-visibility: hidden;
}
.photo-card .img-wrap {
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: inherit;
}
.photo-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(0.22,1,0.36,1);
    will-change: transform;
}
.photo-card:hover img { transform: scale(1.08); }

/* 卡片覆盖信息 */
.photo-card .overlay {
    position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.05) 45%, transparent 60%);
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 22px 14px 12px;
    opacity: 0;
    transition: opacity 0.4s cubic-bezier(0.22,1,0.36,1);
    pointer-events: none;
}
.photo-card:hover .overlay { opacity: 1; }
.overlay .photo-title { color: #fff; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.3px; transform: translateY(10px); transition: transform 0.4s cubic-bezier(0.22,1,0.36,1); }
.photo-card:hover .overlay .photo-title { transform: translateY(0); }
.overlay .photo-tag { display: inline-block; font-size: 0.6rem; color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.1); backdrop-filter: blur(4px); padding: 2px 9px; border-radius: 9999px; margin-top: 4px; width: fit-content; transform: translateY(10px); transition: transform 0.4s cubic-bezier(0.22,1,0.36,1) 0.03s; }
.photo-card:hover .overlay .photo-tag { transform: translateY(0); }

/* 骨架屏 */
.skeleton {
    background: rgba(255,255,255,0.04);
    border-radius: var(--radius);
    animation: shimmer 1.8s ease-in-out infinite;
    background-image: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 100%);
    background-size: 200% 100%;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ===== Lightbox ===== */
.lightbox {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(30px);
    display: flex; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
}
.lightbox.open { opacity: 1; pointer-events: auto; }
.lightbox-inner { position: relative; max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; align-items: center; transform: scale(0.92); transition: transform 0.4s cubic-bezier(0.22,1,0.36,1); }
.lightbox.open .lightbox-inner { transform: scale(1); }
.lightbox-inner img { max-width: 100%; max-height: 80vh; border-radius: var(--radius); box-shadow: 0 25px 80px rgba(0,0,0,0.6); object-fit: contain; }
.lightbox-info { display: flex; justify-content: space-between; width: 100%; padding: 14px 4px 0; color: rgba(255,255,255,0.6); font-size: 0.8rem; }
.lb-close { position: absolute; top: -44px; right: -4px; color: rgba(255,255,255,0.4); font-size: 2rem; cursor: pointer; background: none; border: none; font-family: var(--font); transition: color 0.25s, transform 0.25s; }
.lb-close:hover { color: #fff; transform: rotate(90deg); }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); font-size: 1.2rem; padding: 12px 8px; cursor: pointer; border-radius: 6px; transition: background 0.25s, color 0.25s; font-family: var(--font); }
.lb-nav:hover { background: rgba(255,255,255,0.1); color: #fff; }
.lb-prev { left: -50px; } .lb-next { right: -50px; }
.lb-hint { position: absolute; bottom: -32px; color: rgba(255,255,255,0.1); font-size: 0.6rem; }

/* ===== 响应式 ===== */
@media (max-width: 1024px) {
    .photo-column { width: 200px; }
}
@media (max-width: 720px) {
    .photo-column { width: 160px; }
    .header { padding: 20px 18px 12px; }
    .site-title { font-size: 1.1rem; }
    .filters { padding: 0 18px 12px; gap: 6px; }
    .filter-btn { padding: 4px 14px; font-size: 0.72rem; }
    .viewport-mask { height: calc(100vh - 100px); }
    .scroll-content { padding: 6px 18px; gap: 10px; }
    .lb-nav { font-size: 0.9rem; padding: 8px 6px; }
    .lb-prev { left: 4px; } .lb-next { right: 4px; }
    .lb-close { top: -36px; font-size: 1.5rem; }
}
@media (max-width: 440px) {
    .photo-column { width: 130px; }
    .gap { gap: 8px; }
}
</style>
</head>
<body>

<!-- ===== 头部 ===== -->
<header class="header">
    <div class="header-left">
        <span class="header-icon">📸</span>
        <h1 class="site-title"><strong>照片</strong>墙</h1>
    </div>
</header>

<!-- ===== 筛选栏 ===== -->
<nav class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="nature">🌿 自然</button>
    <button class="filter-btn" data-filter="city">🏙️ 城市</button>
    <button class="filter-btn" data-filter="people">👤 人物</button>
    <button class="filter-btn" data-filter="animal">🐾 动物</button>
</nav>

<!-- ===== 主舞台 ===== -->
<div class="viewport-mask" id="viewportMask">
    <div class="stage" id="stage">
        <div class="scroll-viewport" id="scrollViewport">
            <div class="scroll-content" id="scrollContent"></div>
        </div>
    </div>
</div>

<!-- ===== Lightbox ===== -->
<div class="lightbox" id="lightbox">
    <div class="lightbox-inner">
        <button class="lb-close" id="lbClose">&times;</button>
        <button class="lb-nav lb-prev" id="lbPrev">&#10094;</button>
        <button class="lb-nav lb-next" id="lbNext">&#10095;</button>
        <img src="" alt="" id="lbImage" />
        <div class="lightbox-info">
            <span id="lbTitle"></span>
            <span class="lb-counter" id="lbCounter"></span>
        </div>
        <span class="lb-hint">←  → 键切换 · Esc 关闭</span>
    </div>
</div>

<script>
// =============================================
//  1. 照片数据
// =============================================
var PHOTOS = [];
for (var i = 1; i <= 33; i++) {
    PHOTOS.push({ id: i, src: 'images/' + i + '.jpg', title: '照片 ' + i, tag: 'nature' });
}
var TAG_LABEL = { nature: '🌿 自然', city: '🏙️ 城市', people: '👤 人物', animal: '🐾 动物' };

// =============================================
//  2. DOM
// =============================================
var content = document.getElementById('scrollContent');
var viewport = document.getElementById('scrollViewport');
var mask = document.getElementById('viewportMask');
var stage = document.getElementById('stage');
var filterBtns = document.querySelectorAll('.filter-btn');
var lb = document.getElementById('lightbox');
var lbImg = document.getElementById('lbImage');
var lbTitle = document.getElementById('lbTitle');
var lbCounter = document.getElementById('lbCounter');
var lbClose = document.getElementById('lbClose');
var lbPrev = document.getElementById('lbPrev');
var lbNext = document.getElementById('lbNext');

var currentFilter = 'all';
var currentLBIndex = 0;

// =============================================
//  3. 辅助：获取照片的虚拟比例
//     让每张照片有不同的高度，形成错落感
// =============================================
var RATIOS = [0.66, 0.75, 1.0, 1.25, 1.5, 0.8, 1.33, 1.2, 0.9, 1.1];
function getRatio(id) { return RATIOS[id % RATIOS.length]; }

// =============================================
//  4. 渲染照片墙（列式布局）
// =============================================
function render(filter) {
    filter = filter || 'all';
    currentFilter = filter;
    var photos = filter === 'all' ? PHOTOS : PHOTOS.filter(function(p) { return p.tag === filter; });

    content.innerHTML = '';

    // 计算列数：根据视口宽度和列宽
    var cardW = window.innerWidth <= 440 ? 130 : (window.innerWidth <= 720 ? 160 : (window.innerWidth <= 1024 ? 200 : 220));
    var gap = window.innerWidth <= 440 ? 8 : (window.innerWidth <= 720 ? 10 : 14);
    var availH = viewport.clientHeight - 16;
    var colH = availH; // 列高 = 容器高度

    // 确定每列放多少张
    // 目标：每张卡片高度 = cardW / ratio，总和不超过 colH
    var columns = [];
    var colIdx = 0;

    photos.forEach(function(photo, globalIdx) {
        var ratio = getRatio(photo.id);
        var h = cardW / ratio;

        // 如果当前列容不下，开新列
        if (!columns[colIdx]) columns[colIdx] = { photos: [], totalH: 0 };

        // 检查：当前列总高 + gap + 新卡片高 <= colH
        var nextH = columns[colIdx].totalH + (columns[colIdx].photos.length > 0 ? gap : 0) + h;
        if (nextH > colH && columns[colIdx].photos.length > 0) {
            colIdx++;
            if (!columns[colIdx]) columns[colIdx] = { photos: [], totalH: 0 };
        }

        columns[colIdx].photos.push({ photo: photo, height: h, globalIdx: globalIdx });
        columns[colIdx].totalH += h + (columns[colIdx].photos.length > 1 ? gap : 0);
    });

    // 创建列 DOM
    columns.forEach(function(col) {
        var colDiv = document.createElement('div');
        colDiv.className = 'photo-column';
        colDiv.style.width = cardW + 'px';

        col.photos.forEach(function(item) {
            var card = document.createElement('div');
            card.className = 'photo-card';
            card.style.height = item.height + 'px';

            var wrap = document.createElement('div');
            wrap.className = 'img-wrap';

            var img = document.createElement('img');
            img.src = item.photo.src;
            img.alt = item.photo.title;
            img.loading = 'lazy';
            img.draggable = false;

            wrap.appendChild(img);
            card.appendChild(wrap);

            var overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML =
                '<div class="photo-title">' + esc(item.photo.title) + '</div>' +
                '<span class="photo-tag">' + (TAG_LABEL[item.photo.tag] || item.photo.tag) + '</span>';
            card.appendChild(overlay);

            // 点击 -> Lightbox
            card.addEventListener('click', function() {
                openLB(item.globalIdx, photos);
            });

            // 悬停：提升自身 + 调暗其他 (由事件委托统一处理)
            // 直接在 card 上标记全局索引
            card.dataset.idx = item.globalIdx;

            colDiv.appendChild(card);
        });

        content.appendChild(colDiv);
    });

    // 绑定 hover 效果（事件委托，性能更好）
    bindHoverEffect();
}

function esc(s) { var d = document.createElement('div'); d.appendChild(document.createTextNode(s)); return d.innerHTML; }

// =============================================
//  5. 悬停聚焦：浮起 + 暗化其他
// =============================================
function bindHoverEffect() {
    var cards = content.querySelectorAll('.photo-card');
    cards.forEach(function(card) {
        card.addEventListener('mouseenter', function() {
            cards.forEach(function(c) {
                if (c !== card) c.style.filter = 'brightness(0.45) saturate(0.6)';
            });
            card.style.zIndex = '10';
            card.style.transform = 'scale(1.04)';
            card.style.boxShadow = '0 20px 60px rgba(0,0,0,0.5)';
        });
        card.addEventListener('mouseleave', function() {
            cards.forEach(function(c) {
                c.style.filter = '';
            });
            card.style.zIndex = '';
            card.style.transform = '';
            card.style.boxShadow = '';
        });
    });
}

// =============================================
//  6. 惯性拖拽系统
// =============================================
(function() {
    // ---- 状态 ----
    var isDragging = false;
    var startX = 0;
    var startY = 0;
    var scrollLeft = 0;
    var scrollTop = 0;
    var velocityX = 0;
    var lastX = 0;
    var lastTime = 0;
    var animId = null;
    var isAnimating = false;

    // 摩擦力（0 ~ 1，越小停得越快）
    var FRICTION = 0.92;

    // content 的当前 translateX（正向 = 右移）
    var tx = 0;
    var maxTx = 0;

    // 更新最大可滚动距离
    function updateMaxScroll() {
        var cw = content.scrollWidth;
        var vw = viewport.clientWidth;
        maxTx = Math.max(0, cw - vw);
    }

    // ---- 设置变换（含 clamp） ----
    function setTranslate(x) {
        tx = Math.min(0, Math.max(-maxTx, x));
        content.style.transform = 'translateX(' + tx + 'px) translateZ(0)';
    }

    // ---- 惯性动画循环 ----
    function momentumLoop() {
        if (Math.abs(velocityX) < 0.5) {
            isAnimating = false;
            animId = null;
            return;
        }
        velocityX *= FRICTION;
        setTranslate(tx + velocityX);
        animId = requestAnimationFrame(momentumLoop);
    }

    // 启动惯性
    function startMomentum(v) {
        velocityX = v;
        if (!isAnimating && Math.abs(velocityX) >= 0.5) {
            isAnimating = true;
            if (animId) cancelAnimationFrame(animId);
            animId = requestAnimationFrame(momentumLoop);
        }
    }

    // ---- 鼠标/指针事件 ----
    function onPointerDown(e) {
        // 如果点在卡片上（非拖拽，是点击），允许点击
        // 但要区分点击和拖拽
        isDragging = true;
        isAnimating = false;
        if (animId) { cancelAnimationFrame(animId); animId = null; }
        velocityX = 0;

        var point = e.touches ? e.touches[0] : e;
        startX = point.clientX;
        startY = point.clientY;
        lastX = point.clientX;
        lastTime = Date.now();
        scrollLeft = tx;
        updateMaxScroll();
    }

    function onPointerMove(e) {
        if (!isDragging) return;
        e.preventDefault();

        var point = e.touches ? e.touches[0] : e;
        var dx = point.clientX - startX;
        var now = Date.now();

        // 计算速度（用于惯性）
        var dt = now - lastTime;
        if (dt > 0) {
            velocityX = (point.clientX - lastX) / dt * 16; // 归一化到 ~16ms 帧
            // 限制速度范围
            velocityX = Math.max(-50, Math.min(50, velocityX));
        }
        lastX = point.clientX;
        lastTime = now;

        setTranslate(scrollLeft + dx);
    }

    function onPointerUp(e) {
        if (!isDragging) return;
        isDragging = false;
        // 启动惯性
        startMomentum(velocityX);
    }

    // ---- 滚轮事件 ----
    function onWheel(e) {
        e.preventDefault();
        var delta = e.deltaX || e.deltaY || 0;
        // 鼠标滚轮映射：向下滚动 = 向左滑（内容右移），但感觉更自然的是向下 = 右滑
        // 这里用向下 = 左移（内容右移为正）
        updateMaxScroll();
        var move = delta * 1.2;
        setTranslate(tx + move);

        // 给滚轮也加一点惯性（小动量）
        var v = -delta * 0.08;
        v = Math.max(-30, Math.min(30, v));
        startMomentum(v);
    }

    // ---- 窗口 resize ----
    function onResize() {
        updateMaxScroll();
        // clamp
        if (tx < -maxTx) setTranslate(-maxTx);
        if (tx > 0) setTranslate(0);
    }

    // ---- 绑定 ----
    viewport.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    viewport.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    viewport.addEventListener('wheel', onWheel, { passive: false });

    window.addEventListener('resize', onResize);

    // 公开方法供 render 后调用
    window.__scrollSystem = {
        updateMaxScroll: updateMaxScroll,
        setTranslate: setTranslate,
        onResize: onResize
    };

    // 初始更新
    setTimeout(updateMaxScroll, 100);
})();

// =============================================
//  7. 3D 鼠标视差（阻尼跟随）
// =============================================
(function() {
    var targetRX = 0, targetRY = 0;
    var currentRX = 0, currentRY = 0;
    var aid = null;
    var isMobile = window.innerWidth <= 720;

    function onMove(e) {
        if (isMobile) return;
        var rect = mask.getBoundingClientRect();
        var cx = rect.left + rect.width / 2;
        var cy = rect.top + rect.height / 2;
        var nx = (e.clientX - cx) / (rect.width / 2);
        var ny = (e.clientY - cy) / (rect.height / 2);
        nx = Math.max(-1, Math.min(1, nx));
        ny = Math.max(-1, Math.min(1, ny));

        // 平方映射让中心区更平坦
        var sx = nx * Math.abs(nx);
        var sy = ny * Math.abs(ny);

        targetRY = sx * 4;   // ±4°
        targetRX = sy * -3;  // ±3°

        if (!aid) aid = requestAnimationFrame(tick);
    }

    function tick() {
        var lerp = 0.08;
        currentRX += (targetRX - currentRX) * lerp;
        currentRY += (targetRY - currentRY) * lerp;

        stage.style.transform =
            'rotateX(' + currentRX + 'deg) rotateY(' + currentRY + 'deg)';

        if (Math.abs(targetRX - currentRX) > 0.01 || Math.abs(targetRY - currentRY) > 0.01) {
            aid = requestAnimationFrame(tick);
        } else {
            currentRX = targetRX;
            currentRY = targetRY;
            stage.style.transform = 'rotateX(' + currentRX + 'deg) rotateY(' + currentRY + 'deg)';
            aid = null;
        }
    }

    function onLeave() { targetRX = 0; targetRY = 0; if (!aid) aid = requestAnimationFrame(tick); }

    function onResize() { isMobile = window.innerWidth <= 720; }

    mask.addEventListener('mousemove', onMove);
    mask.addEventListener('mouseleave', onLeave);
    window.addEventListener('resize', onResize);
})();

// =============================================
//  8. Lightbox
// =============================================
var allPhotos = []; // 当前筛选后的照片列表

function openLB(idx, photosArr) {
    allPhotos = photosArr || PHOTOS;
    currentLBIndex = idx;
    var p = allPhotos[idx];
    if (!p) return;
    lbImg.src = p.src;
    lbImg.alt = p.title;
    lbTitle.textContent = p.title + ' · ' + (TAG_LABEL[p.tag] || p.tag);
    lbCounter.textContent = (idx + 1) + ' / ' + allPhotos.length;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeLB() { lb.classList.remove('open'); document.body.style.overflow = ''; }
function prevLB() { if (allPhotos.length) { currentLBIndex = (currentLBIndex - 1 + allPhotos.length) % allPhotos.length; syncLB(); } }
function nextLB() { if (allPhotos.length) { currentLBIndex = (currentLBIndex + 1) % allPhotos.length; syncLB(); } }
function syncLB() { var p = allPhotos[currentLBIndex]; if (p) { lbImg.src=p.src; lbImg.alt=p.title; lbTitle.textContent=p.title+' · '+(TAG_LABEL[p.tag]||p.tag); lbCounter.textContent=(currentLBIndex+1)+' / '+allPhotos.length; } }

// Lightbox 事件
lbClose.addEventListener('click', closeLB);
lb.addEventListener('click', function(e) { if (e.target === lb) closeLB(); });
lbPrev.addEventListener('click', function(e) { e.stopPropagation(); prevLB(); });
lbNext.addEventListener('click', function(e) { e.stopPropagation(); nextLB(); });
document.addEventListener('keydown', function(e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') { closeLB(); return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); prevLB(); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); nextLB(); return; }
});

// =============================================
//  9. 筛选
// =============================================
filterBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
        filterBtns.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');

        // 清空惯性
        if (window.__scrollSystem) {
            window.__scrollSystem.setTranslate(0);
        }

        render(btn.getAttribute('data-filter'));

        // 重新计算滚动
        setTimeout(function() {
            if (window.__scrollSystem) window.__scrollSystem.updateMaxScroll();
        }, 50);
    });
});

// =============================================
//  10. 启动
// =============================================
render('all');
setTimeout(function() {
    if (window.__scrollSystem) window.__scrollSystem.updateMaxScroll();
}, 100);
</script>
</body>
</html>
